; batman — прошивка ESP32 DevKitC (WROOM-32)
; Сирці лежать у batman/ як Arduino-скетч (batman.ino + .cpp/.h), тому те саме
; збирається і arduino-cli: arduino-cli compile --fqbn esp32:esp32:esp32 batman
[platformio]
src_dir = batman
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    robtillaart/ADS1X15 @ ^0.6.2
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^4.0.4
    olikraus/U8g2 @ ^2.36.0
    bblanchon/ArduinoJson @ ^7.4.0
